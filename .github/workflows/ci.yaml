  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # needs:
    #   - unit
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
      - name: Set up tox and tox-uv
        run: uv tool install tox --with tox-uv
      - name: Set up Concierge
        run: sudo snap install --classic concierge
      - name: Set up Juju and charm development tools
        run: sudo concierge prepare -p k8s
      - name: Pack the charm
        # The integration tests don't pack the charm. Instead, they look for a .charm
        # file in the project dir (or use CHARM_PATH, if set).
        run: charmcraft pack
      - name: Run integration tests
        run: |
          run_timed() {
            local label="$1"
            shift
            local start
            local end
            local elapsed
            start=$(date +%s)
            "$@"
            end=$(date +%s)
            elapsed=$((end - start))
            echo "[timing] ${label}: ${elapsed}s"
          }

          run_timed "test_deploy_app" uv run --group integration pytest -v -s --tb native --log-cli-level=INFO tests/integration/test_deploy_app.py --juju-model speedrun --no-juju-teardown
          for i in {1..10}; do
            run_timed "test_deploy_postgres iter=${i}" uv run --group integration pytest -v -s --tb native --log-cli-level=INFO tests/integration/test_deploy_postgres.py --juju-model speedrun --no-juju-teardown
            if [[ "$i" -lt 10 ]]; then
              uv run --group integration pytest -v -s --tb native --log-cli-level=INFO tests/integration/test_remove_postgres.py --juju-model speedrun --no-juju-teardown
            fi
          done
          run_timed "test_integrate" uv run --group integration pytest -v -s --tb native --log-cli-level=INFO tests/integration/test_integrate.py --juju-model speedrun
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: juju-dump-logs
          path: logs
